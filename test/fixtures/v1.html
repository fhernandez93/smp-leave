      h("div", {}, displayName(m), m.id === S.memberId ? h("span", { class: "dim", text: " (you)" }) : null),
      h("div", { class: "tiny dim num", text: num(b.taken) + " taken, " + num(b.left) + " left in " + S.year })));
    if (m.role === "manager") row.append(h("span", { class: "pill mgr", text: "Approves leave" }));
    if (m.archived) row.append(h("span", { class: "pill", text: "Archived" }));
    else if (!linked) row.append(h("span", { class: "pill", title: "Not matched to a Claude account yet", text: "Not linked" }));
    else if (unresolved) row.append(h("span", { class: "pill", title: "Their Claude profile no longer resolves", text: "Not found" }));

    if (editable) {
      const ent = h("input", {
        class: "ent num", type: "number", step: "0.5", min: "0", max: "90",
        value: String(entitlement(m, S.year)), title: "Vacation days for " + S.year,
        onchange: async e => {
          const next = Object.assign({}, m.entitlements || {}); next[S.year] = Number(e.target.value);
          await write(() => S.db.doc("members/" + m.id).update({ entitlements: next }), "Entitlement updated");
        }
      });
      const carry = h("input", {
        class: "ent num", type: "number", step: "0.5", min: "-30", max: "60",
        value: String(carryover(m, S.year)), title: "Days carried over into " + S.year,
        onchange: async e => {
          const next = Object.assign({}, m.carryover || {}); next[S.year] = Number(e.target.value);
          await write(() => S.db.doc("members/" + m.id).update({ carryover: next }), "Carry-over updated");
        }
      });
      row.append(h("label", { class: "tiny dim", style: "display:flex;gap:6px;align-items:center" }, "Days", ent));
      row.append(h("label", { class: "tiny dim", style: "display:flex;gap:6px;align-items:center" }, "Carried", carry));
      row.append(h("button", {
        class: "btn sm ghost", type: "button", onclick: () => write(() =>
          S.db.doc("members/" + m.id).update({ role: m.role === "manager" ? "member" : "manager" }),
          m.role === "manager" ? "No longer approves leave" : "Can now approve leave")
      }, m.role === "manager" ? "Remove approver" : "Make approver"));
      row.append(h("button", { class: "btn sm ghost", type: "button", onclick: () => renameMember(m) },
        m.name ? "Edit name" : linked ? "Override name" : "Rename"));
      row.append(h("button", {
        class: "btn sm ghost", type: "button", onclick: () => write(() =>
          S.db.doc("members/" + m.id).update({ archived: !m.archived, keepUnresolved: false }),
          m.archived ? "Restored" : "Archived")
      }, m.archived ? "Restore" : "Archive"));
    }
    list.append(row);
  }
  panel.append(list);
  if (editable) panel.append(h("div", { class: "pad tiny dim" },
    "Pull people out of your Claude team, or type them in by hand — ",
    h("button", { class: "btn sm ghost", style: "padding:1px 6px", type: "button", onclick: () => openAddPeople() }, "add people"),
    "."));
  if (!editable) panel.append(h("div", { class: "pad tiny dim", text: "Only a manager can change the roster." }));
  if (!managerCount()) panel.append(h("div", { class: "pad small", style: "color:var(--warn)" },
    "Nobody can approve leave yet. Mark at least one person as an approver, or long requests will sit unanswered."));
  frag.append(panel);

  return frag;
}

function avatar(uid) {
  const p = uid && S.profiles[uid];
  const src = p && p.avatarUrl;
  if (!src) return h("span", {
    style: "width:26px;height:26px;border-radius:50%;flex:0 0 auto;background:var(--surface-3)"
  });
  return h("img", { src, alt: "", width: 26, height: 26, loading: "lazy", style: "border-radius:50%;flex:0 0 auto" });
}

/* ============================================================
   Importing people from the Claude team
   ============================================================ */
/* One place to add anyone: search the Claude team, sweep the directory,
   or just type names in. */
function openAddPeople(which) {
  let tab = which || (S.user ? "team" : "name");

  const segTeam = h("button", { type: "button", onclick: () => show("team") }, "From your Claude team");
  const segName = h("button", { type: "button", onclick: () => show("name") }, "By name");
  const seg = h("div", { class: "seg", style: "margin-bottom:14px" }, segTeam, segName);

  /* --- search pane --- */
  const input = h("input", { type: "text", placeholder: "Search your Claude team by name" });
  const results = h("div", { class: "mlist", style: "max-height:38vh;overflow-y:auto;margin:12px -18px 0;border-top:1px solid var(--line)" });
  const status = h("div", { class: "tiny dim", style: "margin-top:10px" });
  let token = 0;
  async function runSearch() {
    if (!S.user) return;
    const mine = ++token;
    let hits = [];
    try { hits = await S.user.search(input.value); } catch (e) { hits = []; }
    if (mine !== token) return;
    paint(hits, input.value);
  }
  let directoryAnswered = false;
  function paint(hits, q) {
    clear(results);
    if (hits.length) directoryAnswered = true;
    const onRoster = new Set(S.members.map(uidOf).filter(Boolean));
    if (!hits.length) {
      if (q) {
        results.append(h("div", { class: "pad tiny dim" },
          "Nobody in your Claude team matched that. ",
          h("button", { class: "btn sm", type: "button", onclick: () => show("name", q.trim()) }, "Add by name instead")));
      } else if (!directoryAnswered) {
        results.append(h("div", { class: "pad" },
          h("strong", { class: "small", style: "display:block;margin-bottom:4px" }, "No Claude team directory here"),
          h("span", { class: "tiny dim" },
            "This account isn’t in a Claude organization that shares its member list, so there is nobody to import. Everything else works the same — put the group in by name."),
          h("div", { style: "margin-top:10px" },
            h("button", { class: "btn sm primary", type: "button", onclick: () => show("name") }, "Add people by name"))));
      } else {
        results.append(h("div", { class: "pad tiny dim", text: "Start typing a name." }));
      }
      return;
    }
    for (const p of hits) {
      const isMe = p.id === S.uid;
      const row = h("div", { class: "mrow" }, avatarFor(p),
        h("div", { class: "nm" },
          h("div", {}, p.name || "Someone", isMe ? h("span", { class: "dim", text: " (you)" }) : null),
          p.email ? h("div", { class: "tiny dim", text: p.email }) : null));
      if (onRoster.has(p.id)) row.append(h("span", { class: "pill", text: isMe ? "That’s you" : "On the team" }));
      else row.append(h("button", {
        class: "btn sm primary", type: "button",
        onclick: () => addFromDirectory(p).then(runSearch)
      }, "Add"));
      results.append(row);
    }
  }
  input.addEventListener("input", runSearch);

  const paneTeam = h("div", {}, input, results, status);

  /* --- by-name pane --- */
  const names = h("textarea", { placeholder: "Anja Brunner\nPierre Chassot\nTomás Reyes", style: "min-height:140px" });
  const paneName = h("div", {},
    h("p", { class: "muted small", style: "margin:0 0 8px" },
      "One name per line. Anyone added this way can still tap “That’s me” when they open the tracker, which links their Claude account from then on."),
    names);

  /* --- footer action switches with the pane --- */
  const act = h("button", { class: "btn primary", type: "button" });

  async function scan() {
    if (S.scanning || !S.user) return;
    S.scanning = true; act.disabled = true;
    const letters = "abcdefghijklmnopqrstuvwxyz".split("");
    const found = new Map();
    for (let i = 0; i < letters.length; i++) {
      status.textContent = "Sweeping the directory… " + Math.round((i / letters.length) * 100) + "%";
      let hits = [];
      try { hits = await S.user.search(letters[i]); } catch (e) { hits = []; }
      for (const p of hits) if (p && p.id && p.name) found.set(p.id, p);
    }
    S.scanning = false; act.disabled = false; status.textContent = "";
    const people = [...found.values()].sort((a, b) => a.name.localeCompare(b.name));
    const onRoster = new Set(S.members.map(uidOf).filter(Boolean));
    if (!people.length) {
      paint([], "");
      toast("No Claude team directory for this account — add people by name.", true);
      return;
    }
    if (people.every(p => onRoster.has(p.id))) {
      toast(people.length === 1
        ? "The directory only returned you, and you’re already on the roster."
        : "Everyone the directory returned is already on the roster.");
      return;
    }
    openImport(people);
  }

  async function addTyped() {
    const have = new Set(S.members.map(m => displayName(m).toLowerCase()));
    const list = names.value.split("\n").map(x => x.trim()).filter(Boolean)
      .filter((n, i, all) => all.indexOf(n) === i && !have.has(n.toLowerCase()));
    if (!list.length) { toast("Everyone on that list is already on the roster."); return; }
    act.disabled = true;
    let added = 0;
    for (const n of list) {
      const id = newId("m_");
      const ok = await write(() => S.db.doc("members/" + id).set(blankMember({ name: n })));
      if (ok) added++; else break;
    }
    act.disabled = false;
    names.value = "";
    toast(added ? "Added " + added + (added === 1 ? " person" : " people") : "Nobody was added");
  }

  function show(next, seedName) {
    tab = next;
    segTeam.setAttribute("aria-pressed", String(tab === "team"));
    segName.setAttribute("aria-pressed", String(tab === "name"));
    paneTeam.style.display = tab === "team" ? "" : "none";
    paneName.style.display = tab === "name" ? "" : "none";
    clear(act);
    if (tab === "team") { act.textContent = "Sweep the whole directory"; act.onclick = scan; }
    else { act.textContent = "Add them"; act.onclick = addTyped; }
    if (seedName) names.value = seedName;
    setTimeout(() => (tab === "team" ? input : names).focus(), 20);
  }

  const body = h("div", {},
    S.user ? seg : null,
    paneTeam, paneName,
    h("p", { class: "tiny dim", style: "margin:14px 0 0" },
      "Claude offers a search over your team, never a full list, so the sweep goes letter by letter and can miss someone. Nothing is added until you confirm it."));

  modal("Add people to the team", body,
    [h("span", { class: "spacer" }),
      h("button", { class: "btn", type: "button", onclick: closeModal }, "Done"), act]);
  show(tab);
  if (S.user) runSearch();
}

function avatarFor(p) {
  if (!p || !p.avatarUrl) return h("span", { style: "width:26px;height:26px;border-radius:50%;flex:0 0 auto;background:var(--surface-3)" });
  return h("img", { src: p.avatarUrl, alt: "", width: 26, height: 26, loading: "lazy", style: "border-radius:50%;flex:0 0 auto" });
}

function addFromDirectory(p) {
  const id = newId("m_");
  return write(() => S.db.doc("members/" + id).set(blankMember({
    uid: p.id, nameHint: p.name || "", source: "directory"
  })), "Added " + (p.name || "them"));
}

/** Confirm sheet after a directory scan. */
function openImport(people) {
  const onRoster = new Set(S.members.map(uidOf).filter(Boolean));
  const fresh = people.filter(p => !onRoster.has(p.id));
  const picked = new Set(fresh.map(p => p.id));
  const list = h("div", { style: "max-height:46vh;overflow-y:auto;margin:0 -18px" });
  const go = h("button", { class: "btn primary", type: "button" });

  function label() {
    go.textContent = picked.size ? "Add " + picked.size + (picked.size === 1 ? " person" : " people") : "Add nobody";
    go.disabled = !picked.size;
  }
  for (const p of people) {
    const already = onRoster.has(p.id);
    const cb = h("input", { type: "checkbox" });
    cb.checked = !already; cb.disabled = already;
    cb.addEventListener("change", () => { cb.checked ? picked.add(p.id) : picked.delete(p.id); label(); });
    list.append(h("label", { class: "mrow", style: "cursor:pointer" }, cb, avatarFor(p),
      h("div", { class: "nm" }, h("div", { text: p.name }),
        p.email ? h("div", { class: "tiny dim", text: p.email }) : null),
      already ? h("span", { class: "pill", text: "Already on the team" }) : null));
  }
  label();

  go.addEventListener("click", async () => {
    go.disabled = true;
    let added = 0;
    for (const p of fresh) {
      if (!picked.has(p.id)) continue;
      const id = newId("m_");
      const ok = await write(() => S.db.doc("members/" + id).set(blankMember({
        uid: p.id, nameHint: p.name || "", source: "directory"
      })));
      if (ok) added++;
    }
    closeModal();
    toast(added ? "Added " + added + (added === 1 ? " person" : " people") : "Nobody was added");
  });

  modal("Found " + people.length + " in your Claude team",
    h("div", {},
      h("p", { class: "muted small", style: "margin:0 0 10px" },
        "Everyone the directory would show. Untick anyone who isn’t in the Physics Team — students and collaborators from other groups will be in here too."),
      list),
    [h("span", { class: "spacer" }),
      h("button", { class: "btn", type: "button", onclick: closeModal }, "Cancel"), go]);
}

function addMember() { openAddPeople("name"); }

function renameMember(m) {
  askModal({
    title: uidOf(m) ? "Override the name" : "Rename",
    text: uidOf(m) ? "Leave this empty to follow their Claude profile instead." : "",
    label: "Full name", value: m.name || displayName(m), ok: "Save", required: !uidOf(m),
    onOk: (name) => write(() => S.db.doc("members/" + m.id).update({ name: name }), name ? "Renamed" : "Following their Claude profile")
  });
}

/* ============================================================
   Settings
   ============================================================ */
function renderSettings() {
  const frag = document.createDocumentFragment();
  const s = S.settings;

  const teamIn = h("input", { type: "text", value: s.teamName || "" });
  const daysIn = h("input", { type: "number", min: "0", max: "90", step: "0.5", value: String(s.defaultDays) });
  const thrIn = h("input", { type: "number", min: "0", max: "30", step: "0.5", value: String(s.approvalThreshold) });
  const hpdIn = h("input", { type: "number", min: "1", max: "14", step: "0.1", value: String(hoursPerDay()) });
  const wd = h("div", { style: "display:flex;gap:14px;flex-wrap:wrap;margin-top:2px" });
  const wdBoxes = [];
  [["Mon", 1], ["Tue", 2], ["Wed", 3], ["Thu", 4], ["Fri", 5], ["Sat", 6], ["Sun", 0]].forEach(([lbl, v]) => {
    const cb = h("input", { type: "checkbox", value: v });
    cb.checked = s.workdays.includes(v);
    wdBoxes.push([cb, v]);
    wd.append(h("label", { class: "check", style: "margin:0" }, cb, h("span", { text: lbl })));
  });

  const save = h("button", { class: "btn primary", type: "button" }, "Save settings");
  save.addEventListener("click", async () => {
    const workdays = wdBoxes.filter(([cb]) => cb.checked).map(([, v]) => v);
    if (!workdays.length) { toast("Pick at least one working day.", true); return; }
    save.disabled = true;
    await saveSettings({
      teamName: teamIn.value.trim() || DEFAULTS.teamName,
      defaultDays: Number(daysIn.value) || 0,
      approvalThreshold: Number(thrIn.value) || 0,
      hoursPerDay: Number(hpdIn.value) || DEFAULTS.hoursPerDay,
      workdays
    });
    save.disabled = false;
  });

  frag.append(h("div", { class: "panel" },
    h("div", { class: "hd" }, h("h2", { text: "How this team works" })),
    h("div", { class: "pad" },
      h("label", { class: "field" }, h("span", { text: "Team name" }), teamIn),
      h("div", { class: "row2" },
        h("label", { class: "field" }, h("span", { text: "Default vacation days per year" }), daysIn),
        h("label", { class: "field" }, h("span", { text: "Days bookable without approval" }), thrIn)),
      h("p", { class: "tiny dim", style: "margin:-6px 0 14px" },
        "Vacation and time off in lieu longer than " + num(s.approvalThreshold) + " working days go to an approver. Sick leave and remote days are logged directly, and every overtime entry needs approval whatever its size."),
      h("label", { class: "field" }, h("span", { text: "Hours in a full working day" }), hpdIn),
      h("p", { class: "tiny dim", style: "margin:-6px 0 14px" },
        "Used to turn banked overtime into days off in lieu. The State of Fribourg contracts 42 h a week at 100 %, which is 8.4 h over five days."),
      h("label", { class: "field", style: "margin-bottom:4px" }, h("span", { text: "Working days" })), wd,
      h("div", { style: "margin-top:16px" }, save))));

  /* holidays */
  const holPanel = h("div", { class: "panel" });
  holPanel.append(h("div", { class: "hd" },
    h("h2", { text: "Days off, as the State of Fribourg sets them" }),
    h("span", { class: "spacer" }),
    yearPicker()));

  const e = easter(S.year);
  const ye = yearEndFor(S.year);
  function holRow(def) {
    const d = def.fixed ? new Date(Date.UTC(S.year, def.fixed[0] - 1, def.fixed[1])) : addDays(e, def.easter);
    const on = s.holidays.includes(def.key);
    const cb = h("input", { type: "checkbox" });
    cb.checked = on;
    cb.addEventListener("change", async () => {
      const set = new Set(s.holidays);
      if (cb.checked) set.add(def.key); else set.delete(def.key);
      await saveSettings({ holidays: [...set] });
    });
    const line = [def.de, fmtShort(iso(d)) + " " + S.year];
    if (def.fraction === 0.5) line.push("afternoon only");
    const wrap = h("label", { class: "check" }, cb,
      h("span", {}, def.name,
        h("span", { class: "tiny dim", style: "display:block", text: line.join(", ") })));
    if (def.yearly) {
      const sel = h("select", { style: "width:auto;margin-left:auto;font-size:12.5px;padding:3px 6px" });
      [["0", "not free"], ["0.5", "afternoon"], ["1", "full day"]].forEach(([v, lbl]) => {
        const o = h("option", { value: v, text: lbl });
        if (Number(v) === Number(ye[def.key] || 0)) o.selected = true;
        sel.append(o);
      });
      sel.addEventListener("change", async () => {
        const next = Object.assign({}, s.yearEnd || {});
        next[S.year] = Object.assign({}, YEAR_END[S.year] || YEAR_END_FALLBACK, next[S.year] || {});
        next[S.year][def.key] = Number(sel.value);
        await saveSettings({ yearEnd: next });
      });
      wrap.style.alignItems = "center";
      wrap.append(sel);
    }
    return wrap;
  }

  const legalGrid = h("div", { class: "hol-grid" });
  HOLIDAY_DEFS.filter(d => d.kind === "legal").forEach(d => legalGrid.append(holRow(d)));
  const svcGrid = h("div", { class: "hol-grid" });
  HOLIDAY_DEFS.filter(d => d.kind === "service").forEach(d => svcGrid.append(holRow(d)));

  holPanel.append(h("div", { class: "pad" },
    h("h3", { class: "small", style: "margin-bottom:8px" }, "Gesetzliche Feiertage",
      h("span", { class: "tiny dim", style: "font-weight:400" }, " — the nine fixed in cantonal law")),
    legalGrid,
    h("h3", { class: "small", style: "margin:20px 0 8px" }, "Dienstfreie Tage",
      h("span", { class: "tiny dim", style: "font-weight:400" }, " — granted on top, and reset every year")),
    svcGrid,
    h("p", { class: "tiny dim", style: "margin:16px 0 0" },
      PUBLISHED_YEARS.includes(S.year)
        ? "Set from the calendar the Amt für Personal und Organisation published for " + S.year + " (fr.ch). In " + S.year + ", " + (yearEndFor(S.year).dec24 === 0.5 ? "24 December is a free afternoon" : yearEndFor(S.year).dec24 ? "24 December is a full day off" : "24 December is a normal working day") + " and " + (yearEndFor(S.year).dec31 ? "31 December is free" : "31 December is a normal working day") + "."
        : "The State hasn’t published " + S.year + " here yet — 24 and 31 December are carried over as a guess. Set them above once fr.ch publishes the year."),
    h("p", { class: "tiny dim", style: "margin:6px 0 0" },
      "If your group follows a different employer’s calendar, switch any of these off.")));

  /* custom closures */
  const custom = h("div", { class: "mlist" });
  const yearCustom = s.customHolidays.filter(c => yearOf(c.date) === S.year).sort((a, b) => a.date.localeCompare(b.date));
  for (const c of yearCustom) {
    custom.append(h("div", { class: "mrow" },
      h("span", { class: "num", style: "width:110px", text: fmtDate(c.date) }),
      h("span", { class: "nm", text: c.name }),
      h("span", { class: "pill", text: c.half ? "Half day" : "Full day" }),
      h("button", {
        class: "btn sm ghost", type: "button", onclick: () => saveSettings({
          customHolidays: s.customHolidays.filter(x => !(x.date === c.date && x.name === c.name))
        })
      }, "Remove")));
  }
  const cDate = h("input", { type: "date", value: S.year + "-12-24" });
  const cName = h("input", { type: "text", placeholder: "Reason, e.g. institute closure" });
  const cHalf = h("input", { type: "checkbox" });
  custom.append(h("div", { class: "mrow" },
    h("div", { style: "width:160px" }, cDate),
    h("div", { class: "nm" }, cName),
    h("label", { class: "check", style: "margin:0" }, cHalf, h("span", { text: "Half day" })),
    h("button", {
      class: "btn sm", type: "button", onclick: async () => {
        if (!cDate.value) return;
        await saveSettings({
          customHolidays: s.customHolidays.concat([{
            date: cDate.value, name: cName.value.trim() || "Office closed", half: cHalf.checked
          }])
        });
      }
    }, "Add day off")));
  holPanel.append(h("div", { class: "hd", style: "border-top:1px solid var(--line)" },
    h("h2", { text: "Days your group adds in " + S.year })));
  holPanel.append(custom);
  frag.append(holPanel);

  frag.append(h("div", { class: "panel" },
    h("div", { class: "hd" }, h("h2", { text: "About this tracker" })),
    h("div", { class: "pad small muted" },
      h("p", { style: "margin-top:0" }, "Everyone who can open this artifact sees the whole team’s absences. Balances are worked out live from the requests list, so correcting a request corrects the balance."),
      h("p", {}, "Sick leave and remote days are recorded but never deducted from vacation. Approved overtime banks up as hours and comes back out as time off in lieu."),
      h("p", {}, "The roster and these settings can only be changed by the artifact’s owner and by anyone given Editor access in the share menu. Everyone at Contributor can book their own leave, and approvers confirm the longer requests."),
      h("p", { style: "margin-bottom:0" }, "Days off follow the calendar the Amt für Personal und Organisation publishes for State of Fribourg employees at ",
        h("a", { href: "https://www.fr.ch/de/arbeit-und-unternehmen/arbeiten-beim-staat/kalender-arbeitszeiten-und-weisen", target: "_blank", rel: "noopener" }, "fr.ch"),
        ". Half days such as 1 May and, in some years, 24 December cost half a day of leave, not a whole one."))));
  return frag;
}

/* ============================================================
   Booking
   ============================================================ */
function closeModal() { clear($("#modalHost")); document.removeEventListener("keydown", escClose); }
function modal(title, bodyEl, footEl) {
  const host = $("#modalHost"); clear(host);
  const scrim = h("div", { class: "scrim", onclick: e => { if (e.target === scrim) closeModal(); } });
  const box = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title },
    h("div", { class: "hd" }, h("h2", { text: title }), h("span", { class: "spacer" }),
      h("button", { class: "btn sm ghost", type: "button", "aria-label": "Close", onclick: closeModal }, "✕")),
    h("div", { class: "bd" }, bodyEl),
    footEl ? h("div", { class: "ft" }, footEl) : null);
  scrim.append(box);
  host.append(scrim);
  document.addEventListener("keydown", escClose);
  const first = box.querySelector(".bd select,.bd input,.bd textarea,.bd button") ||
                box.querySelector(".ft .btn.primary,.ft .btn.danger");
  if (first) setTimeout(() => first.focus(), 30);
}
function escClose(e) { if (e.key === "Escape") closeModal(); }

/**
 * One small dialog for confirmations and single-field questions.
 * Replaces window.prompt/confirm, which browsers block inside artifacts.
 */
function askModal(o) {
  const input = !o.label ? null
    : o.multiline
      ? h("textarea", { placeholder: o.placeholder || "", style: "min-height:124px" })
      : h("input", { type: "text", value: o.value || "", placeholder: o.placeholder || "" });
  if (input && o.multiline && o.value) input.value = o.value;
  const body = h("div", {},
    o.text ? h("p", { class: "muted small", style: "margin:0 0 4px", text: o.text }) : null,
    input ? h("label", { class: "field", style: "margin-bottom:0" }, h("span", { text: o.label }), input) : null);
  const go = h("button", { class: "btn " + (o.danger ? "danger" : "primary"), type: "button" }, o.ok || "OK");
  const run = async () => {
    const v = input ? input.value.trim() : "";
    if (o.required && !v) { input.focus(); return; }
    go.disabled = true;
    try { await o.onOk(v); } finally { go.disabled = false; }
    closeModal();
  };
  go.addEventListener("click", run);
  if (input && !o.multiline) input.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
  modal(o.title, body, [h("span", { class: "spacer" }),
    h("button", { class: "btn", type: "button", onclick: closeModal }, "Back"), go]);
}

function openBooking(startISO) {
  if (!S.memberId) return;
  const start = startISO || todayISO();
  const forSel = h("select", {});
  for (const m of activeMembers()) {
    const o = h("option", { value: m.id, text: m.name + (m.id === S.memberId ? " (you)" : "") });
    if (m.id === S.memberId) o.selected = true;
    forSel.append(o);
  }
  const typeSeg = h("div", { class: "seg" });
  let type = "vacation";
  const typeBtns = {};
  for (const k of Object.keys(TYPES)) {
    const b = h("button", { type: "button", onclick: () => { type = k; for (const j in typeBtns) typeBtns[j].setAttribute("aria-pressed", String(j === k)); recalc(); } }, TYPES[k].short || TYPES[k].label);
    b.setAttribute("aria-pressed", String(k === type));
    typeBtns[k] = b; typeSeg.append(b);
  }
  const startIn = h("input", { type: "date", value: start, oninput: () => { if (endIn.value < startIn.value) endIn.value = startIn.value; recalc(); } });
  const endIn = h("input", { type: "date", value: start, oninput: recalc });
  const halfA = h("input", { type: "checkbox", onchange: recalc });
  const halfB = h("input", { type: "checkbox", onchange: recalc });
  const amBtn = h("button", { type: "button" }, "Morning");
  const pmBtn = h("button", { type: "button" }, "Afternoon");
  let period = "am";
  amBtn.addEventListener("click", () => { period = "am"; recalc(); });
  pmBtn.addEventListener("click", () => { period = "pm"; recalc(); });
  const periodSeg = h("div", { class: "seg", style: "max-width:230px;margin:-2px 0 10px 26px" }, amBtn, pmBtn);
  const halfARow = h("label", { class: "check" }, halfA, h("span", { text: "Half day" }));
  const halfBRow = h("label", { class: "check" }, halfB, h("span", { text: "Last day is a half day" }));
  const note = h("textarea", { placeholder: "Anything the team should know (optional)" });
  const calc = h("div", { class: "calc" });
  const submit = h("button", { class: "btn primary", type: "button" }, "Book");

  function draft() {
    return {
      memberId: forSel.value, type,
      start: startIn.value, end: endIn.value,
      halfStart: halfA.checked, halfEnd: halfB.checked && startIn.value !== endIn.value,
      halfPeriod: (halfA.checked && startIn.value === endIn.value) ? period : null
    };
  }
  function recalc() {
    const d = draft();
    const single = d.start === d.end;
    halfARow.querySelector("span").textContent = single ? "Half day" : "First day is a half day (you leave at midday)";
    halfBRow.style.display = single ? "none" : "";
    halfBRow.querySelector("span").textContent = "Last day is a half day (you are back at midday)";
    periodSeg.style.display = (single && halfA.checked) ? "" : "none";
    amBtn.setAttribute("aria-pressed", String(period === "am"));
    pmBtn.setAttribute("aria-pressed", String(period === "pm"));
    clear(calc);
    if (!d.start || !d.end || d.end < d.start) {
      calc.append(h("span", { class: "bad", text: "The end date is before the start date." }));
      submit.disabled = true; return;
    }
    const days = totalDays(d);
    const closed = [], halves = [];
    let x = parseISO(d.start);
    const end = parseISO(d.end);
    while (x <= end) {
      const s = iso(x);
      const hh = isWorkday(x) ? holiday(s) : null;
      if (hh) (hh.fraction >= 1 ? closed : halves).push(hh.name);
      x = addDays(x, 1);
    }
    if (days <= 0) {
      calc.append(h("span", { class: "bad", text: "That range has no working days in it." }));
      submit.disabled = true; return;
    }
    submit.disabled = false;
    calc.append(h("div", {}, "This uses ", h("b", { text: num(days) }), days === 1 ? " working day" : " working days",
      TYPES[type].deducts ? "" : TYPES[type].spendsOvertime ? " from your overtime bank" : " and does not touch the vacation balance", "."));
    if (closed.length) calc.append(h("span", { class: "tiny dim", style: "display:block;margin-top:4px" },
      "Free anyway: " + [...new Set(closed)].join(", ")));
    if (halves.length) calc.append(h("span", { class: "tiny dim", style: "display:block;margin-top:4px" },
      "Counted as a half day: " + [...new Set(halves)].join(", ") + " — the State already gives the afternoon."));
    const b = balance(d.memberId, yearOf(d.start));
    if (TYPES[type].spendsOvertime) {
      const bank = overtimeBalance(d.memberId);
      const cost = days * hoursPerDay();
      const after = bank.left - cost;
      calc.append(h("span", { class: after < 0 ? "bad" : "tiny dim", style: "display:block;margin-top:4px" },
        after < 0
          ? "That costs " + fmtHours(cost) + ", and only " + fmtHours(bank.left) + " is banked."
          : "Costs " + fmtHours(cost) + " of the " + fmtHours(bank.left) + " banked, leaving " + fmtHours(after) + "."));
      if (!bank.banked) calc.append(h("span", { class: "warn" }, "No approved overtime yet — log the hours first and have them approved."));
    }
    if (TYPES[type].deducts) {
      const left = b.left - days;
      calc.append(h("span", { class: left < 0 ? "bad" : "tiny dim", style: "display:block;margin-top:4px" },
        left < 0 ? "That is " + num(-left) + " more than " + memberName(d.memberId) + " has left this year."
          : num(left) + " vacation days would remain in " + yearOf(d.start) + "."));
    }
    const clash = S.requests.filter(r => r.memberId !== d.memberId && r.status !== "rejected" && r.status !== "cancelled" && overlaps(r, d));
    if (clash.length) calc.append(h("span", { class: "warn" },
      "Also away then: " + [...new Set(clash.map(r => memberName(r.memberId)))].join(", ")));
    if (needsApproval(Object.assign({}, d, { type }))) {
      calc.append(h("span", { class: "warn" }, "Longer than " + num(S.settings.approvalThreshold) + " days, so it goes to a manager for approval."));
    }
    submit.textContent = needsApproval(Object.assign({}, d, { type })) ? "Send for approval" : "Book";
  }

  submit.addEventListener("click", async () => {
    const d = draft();
    if (!d.start || !d.end || totalDays(d) <= 0) return;
    const auto = !needsApproval(d);
    const id = newId("r_");
    submit.disabled = true;
    const ok = await write(() => S.db.doc("requests/" + id).set(Object.assign({}, d, {
      note: note.value.trim(),
      status: auto ? "approved" : "pending",
      autoApproved: auto,
      createdBy: S.memberId,
      createdAt: new Date().toISOString(),
      decidedBy: null, decidedAt: null, decisionNote: ""
    })), auto ? "Booked" : "Sent to a manager");
    submit.disabled = false;
    if (ok) closeModal();
  });

  const body = h("div", {},
    activeMembers().length > 1 && amManager()
      ? h("label", { class: "field" }, h("span", { text: "Who is away" }), forSel)
      : null,
    h("label", { class: "field" }, h("span", { text: "Type" }), typeSeg),
    h("div", { class: "row2" },
      h("label", { class: "field" }, h("span", { text: "From" }), startIn),
      h("label", { class: "field" }, h("span", { text: "To" }), endIn)),
    halfARow, periodSeg, halfBRow,
    calc,
    h("label", { class: "field" }, h("span", { text: "Note" }), note));
  modal("Book time away", body, [h("span", { class: "spacer" }),
    h("button", { class: "btn", type: "button", onclick: closeModal }, "Cancel"), submit]);
  recalc();
}

/* ---------- request detail ---------- */
function openRequest(id) {
  const r = S.requests.find(x => x.id === id);
  if (!r) return;
  const days = totalDays(r);
  const body = h("div", {},
    h("div", { style: "display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px" },
      h("span", { class: "chip " + r.type }, h("span", { class: "dot" }), TYPES[r.type].label), statusChip(r)),
    h("div", { class: "num", style: "font-size:17px;font-weight:600" , text: fmtRange(r.start, r.end) }),
    h("div", { class: "muted small num", style: "margin-top:2px", text: plural(days, "working day", "working days") +
      (r.halfStart && r.start === r.end
        ? (r.halfPeriod === "pm" ? " — afternoon" : " — morning")
        : (r.halfStart || r.halfEnd ? " (includes a half day)" : "")) }),
    h("table", { style: "margin-top:14px" }, h("tbody", {},
      h("tr", {}, h("td", { class: "muted", style: "width:42%" }, "Person"), h("td", { text: memberName(r.memberId) })),
      h("tr", {}, h("td", { class: "muted" }, "Requested"), h("td", { class: "num", text: (r.createdAt || "").slice(0, 10) || "—" })),
      r.createdBy && r.createdBy !== r.memberId
        ? h("tr", {}, h("td", { class: "muted" }, "Entered by"), h("td", { text: memberName(r.createdBy) })) : null,
      r.decidedBy ? h("tr", {}, h("td", { class: "muted" }, "Decided by"),
        h("td", { text: memberName(r.decidedBy) + " on " + (r.decidedAt || "").slice(0, 10) })) : null)),
    r.note ? h("div", { class: "note", style: "margin-top:12px", text: r.note }) : null,
    r.decisionNote ? h("div", { class: "note", style: "margin-top:8px", text: "Manager: " + r.decisionNote }) : null);

  const foot = [h("span", { class: "spacer" })];
  const mine = r.memberId === S.memberId;
  if (amManager() && r.status === "pending" && (!mine || managerCount() <= 1 || S.isOwner)) {
    foot.push(h("button", { class: "btn danger", type: "button", onclick: async () => { await decide(r, "rejected"); closeModal(); } }, "Decline"));
    foot.push(h("button", { class: "btn primary", type: "button", onclick: async () => { await decide(r, "approved"); closeModal(); } }, "Approve"));
  } else if ((mine || amManager()) && r.status !== "cancelled") {
    foot.push(h("button", { class: "btn", type: "button", onclick: () => cancelRequest(r) }, "Cancel this leave"));
  }
  foot.push(h("button", { class: "btn ghost", type: "button", onclick: closeModal }, "Close"));
  modal("Leave details", body, foot);
}
